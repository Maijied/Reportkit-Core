  <path d="M 226,372 L 226,222 Q 226,194 254,194 L 258,194 Q 286,194 286,222 L 286,372 Z" fill="#8ef0c4"/>
  <path d="M 328,372 L 328,154 Q 328,126 356,126 L 360,126 Q 388,126 388,154 L 388,372 Z" fill="#ffffff"/>
