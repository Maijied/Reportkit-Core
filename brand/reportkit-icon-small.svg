<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ReportKit">
  <title>ReportKit</title>
  <desc>Simplified ReportKit mark for small sizes (favicon, app icon).</desc>
  <defs>
    <linearGradient id="rkBadgeSm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e8f58"/>
      <stop offset="1" stop-color="#06512f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#rkBadgeSm)"/>

  <!-- baseline -->
