name = "reportkit-demo-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
account_id = "f049faaf2f67549f5c58837479596a4a"

# Keep workers.dev alive for CI smoke tests and fallback URL.
workers_dev = true

# Custom domain: attach api.reportkit.lorapok.tech in Cloudflare dashboard
# (Workers & Pages → reportkit-demo-api → Domains & Routes → Add custom domain).
# Do NOT add `routes` here until lorapok.tech is a zone on this Cloudflare account —
# otherwise wrangler deploy fails and disables workers.dev.

[[d1_databases]]
binding = "DB_LIVE"
database_name = "reportkit_live"
database_id = "${REPORTKIT_LIVE}"

[[d1_databases]]
binding = "DB_ARCHIVE"
database_name = "reportkit_archive"
database_id = "${REPORTKIT_ARCHIVE}"

[triggers]
crons = ["0 3 * * *"]

[vars]
ALLOWED_ORIGIN = "https://reportkit.lorapok.tech"
