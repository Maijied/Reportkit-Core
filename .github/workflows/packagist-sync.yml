name: Packagist sync

on:
  workflow_dispatch:
    inputs:
      strict:
        description: Fail if any package URL does not match expected layout
        type: boolean
        default: true
      notify:
        description: Call Packagist update-package after verify
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PACKAGIST_USER: ${{ secrets.PACKAGIST_USER }}
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Packagist repository URLs
        run: bash reportkit-website/scripts/packagist-verify-monorepo.sh --strict

      - name: Notify Packagist (all repos)
        if: inputs.notify == true
        run: |
          if [ -z "${PACKAGIST_USER:-}" ] || [ -z "${PACKAGIST_TOKEN:-}" ]; then
            echo "::warning::PACKAGIST_USER/TOKEN missing"
            exit 0
          fi
          for repo in \
            https://github.com/Maijied/Reportkit-Core \
            https://github.com/Maijied/Reportkit-Laravel \
            https://github.com/Maijied/Reportkit-Laravel-Legacy; do
            echo "== update-package ${repo}"
            curl -sS -X POST \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${PACKAGIST_USER}:${PACKAGIST_TOKEN}" \
              'https://packagist.org/api/update-package' \
              -d "{\"repository\":{\"url\":\"${repo}\"}}" \
              | jq -c '{status, message: (.message // .error // "ok")}' 2>/dev/null || true
          done

      - name: Final verify
        run: bash reportkit-website/scripts/packagist-verify-monorepo.sh --strict
