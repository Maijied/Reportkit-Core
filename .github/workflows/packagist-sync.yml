name: Packagist sync

on:
  workflow_dispatch:
    inputs:
      strict:
        description: Fail if laravel packages are not on the monorepo URL yet
        type: boolean
        default: true
      notify:
        description: Call Packagist update-package after verify
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PACKAGIST_USER: ${{ secrets.PACKAGIST_USER }}
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
      MONOREPO: https://github.com/Maijied/Reportkit-Core
    steps:
      - uses: actions/checkout@v4

      - name: Verify Packagist repository URLs
        run: bash reportkit-website/scripts/packagist-verify-monorepo.sh --strict

      - name: Notify Packagist (monorepo hook)
        if: inputs.notify == true
        run: |
          if [ -z "${PACKAGIST_USER:-}" ] || [ -z "${PACKAGIST_TOKEN:-}" ]; then
            echo "::warning::PACKAGIST_USER/TOKEN missing — set secrets on Reportkit-Core"
            exit 0
          fi
          for pkg in core laravel laravel-legacy; do
            echo "== Trigger update for reportkit/${pkg}"
            resp=$(curl -sS -X POST \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${PACKAGIST_USER}:${PACKAGIST_TOKEN}" \
              'https://packagist.org/api/update-package' \
              -d "{\"repository\":{\"url\":\"${MONOREPO}\"}}")
            echo "$resp" | jq -c '{status, message: (.message // .error // "ok")}' 2>/dev/null || echo "$resp"
          done

      - name: Re-verify after notify
        if: inputs.notify == true
        run: bash reportkit-website/scripts/packagist-verify-monorepo.sh --strict
