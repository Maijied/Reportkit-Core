name: README badge stats

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh badge stats JSON
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node reportkit-website/scripts/update-readme-badges.mjs
      - name: Commit stats if changed
        run: |
          if git diff --quiet .github/badges/stats.json; then
            echo "No badge stat changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/stats.json
          git commit -m "chore: refresh README badge stats"
          git push
