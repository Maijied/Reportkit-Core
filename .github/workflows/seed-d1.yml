name: Seed D1 (manual)

on:
  workflow_dispatch:
    inputs:
      scale:
        description: 'Seed scale (default|large)'
        required: false
        default: 'default'

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      REPORTKIT_LIVE: ${{ secrets.REPORTKIT_LIVE }}
      REPORTKIT_ARCHIVE: ${{ secrets.REPORTKIT_ARCHIVE }}
    defaults:
      run:
        working-directory: reportkit-website/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: SEED_SCALE=${{ github.event.inputs.scale }} npm run seed:sql
      - name: Verify D1 secrets
        run: |
          test -n "$REPORTKIT_LIVE" || (echo "::error::Missing REPORTKIT_LIVE repository secret" && exit 1)
          test -n "$REPORTKIT_ARCHIVE" || (echo "::error::Missing REPORTKIT_ARCHIVE repository secret" && exit 1)
      - name: Bind D1 IDs into wrangler.toml
        run: |
          sed -i "s|\${REPORTKIT_LIVE}|${REPORTKIT_LIVE}|g" wrangler.toml
          sed -i "s|\${REPORTKIT_ARCHIVE}|${REPORTKIT_ARCHIVE}|g" wrangler.toml
      - name: Verify Cloudflare Account API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^Bearer //')"
          HTTP=$(curl -sS -o /tmp/cf-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database")
          echo "Cloudflare D1 list HTTP ${HTTP}"
          cat /tmp/cf-verify.json | head -c 500
          echo
          test "$HTTP" = "200" || (echo "::error::Invalid CLOUDFLARE_API_TOKEN or missing D1 permissions" && exit 1)
      - name: Apply schemas + seed
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: reportkit-website/worker
          command: |
            d1 execute reportkit_live --remote --command="CREATE TABLE IF NOT EXISTS trips (trip_id TEXT PRIMARY KEY, booked_at TEXT NOT NULL, operator TEXT NOT NULL, route TEXT NOT NULL, channel TEXT NOT NULL, seats INTEGER NOT NULL, fare_cents INTEGER NOT NULL, status TEXT NOT NULL);"
            d1 execute reportkit_live --remote --command="CREATE INDEX IF NOT EXISTS idx_trips_booked ON trips (booked_at, operator);"
            d1 execute reportkit_live --remote --command="CREATE TABLE IF NOT EXISTS report_stats (key TEXT PRIMARY KEY, value INTEGER NOT NULL, updated_at TEXT NOT NULL);"
            d1 execute reportkit_archive --remote --command="CREATE TABLE IF NOT EXISTS trips (trip_id TEXT PRIMARY KEY, booked_at TEXT NOT NULL, operator TEXT NOT NULL, route TEXT NOT NULL, channel TEXT NOT NULL, seats INTEGER NOT NULL, fare_cents INTEGER NOT NULL, status TEXT NOT NULL);"
            d1 execute reportkit_archive --remote --command="CREATE INDEX IF NOT EXISTS idx_trips_booked ON trips (booked_at, operator);"
            d1 execute reportkit_live --remote --file=./seed/live.seed.sql
            d1 execute reportkit_archive --remote --file=./seed/archive.seed.sql
