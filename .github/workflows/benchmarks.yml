name: Benchmarks

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: reportkit-website

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run in-memory merge benchmark
        run: |
          node <<'EOF'
          const fs = require('fs');
          function dedupe(rows, key) {
            const seen = new Set(); const out = [];
            for (const r of rows) {
              const id = String(r[key]);
              if (seen.has(id)) continue;
              seen.add(id); out.push(r);
            }
            return out;
          }
          function run(n) {
            const live = Array.from({length: n}, (_, i) => ({trip_id: 'T'+i, booked_at: '2026-01-01', v: i}));
            const arch = Array.from({length: n}, (_, i) => ({trip_id: 'T'+(i < n*0.05 ? i : i+n), booked_at: '2025-01-01', v: i}));
            const t0 = performance.now();
            const merged = dedupe(live.concat(arch), 'trip_id');
            const ms = performance.now() - t0;
            return { rows: merged.length, ms: Math.round(ms * 10) / 10 };
          }
          const runs = [10000, 100000].map((n) => {
            const r = run(n);
            return { rows: r.rows, sources: 2, dedupe_key: 'trip_id', page_size: 25, ms: r.ms };
          });
          const out = {
            generated_at: new Date().toISOString(),
            provenance: 'measured',
            methodology: 'In-memory merge+dedupe over synthetic arrays in GitHub Actions. Not DB I/O.',
            runs,
          };
          fs.mkdirSync('src/data', { recursive: true });
          fs.writeFileSync('src/data/benchmarks.json', JSON.stringify(out, null, 2) + '\n');
          console.log(JSON.stringify(out, null, 2));
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-json
          path: reportkit-website/src/data/benchmarks.json
