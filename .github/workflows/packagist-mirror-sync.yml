name: Packagist mirror sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['laravel/v*', 'laravel-legacy/v*']
    paths:
      - 'reportkit-laravel/**'
      - 'reportkit-laravel-legacy/**'
      - '.github/workflows/packagist-mirror-sync.yml'
      - 'reportkit-website/scripts/packagist-mirror-subdir.sh'

permissions:
  contents: read

jobs:
  mirror-laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - name: Mirror reportkit-laravel → Reportkit-Laravel
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        run: |
          chmod +x reportkit-website/scripts/packagist-mirror-subdir.sh
          bash reportkit-website/scripts/packagist-mirror-subdir.sh \
            reportkit-laravel Maijied/Reportkit-Laravel laravel/

  mirror-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - name: Mirror reportkit-laravel-legacy → Reportkit-Laravel-Legacy
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        run: |
          chmod +x reportkit-website/scripts/packagist-mirror-subdir.sh
          bash reportkit-website/scripts/packagist-mirror-subdir.sh \
            reportkit-laravel-legacy Maijied/Reportkit-Laravel-Legacy laravel-legacy/

  notify-packagist:
    needs: [mirror-laravel, mirror-legacy]
    runs-on: ubuntu-latest
    if: always() && needs.mirror-laravel.result == 'success' && needs.mirror-legacy.result == 'success'
    env:
      PACKAGIST_USER: ${{ secrets.PACKAGIST_USER }}
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
    steps:
      - name: Trigger Packagist update on mirror repos
        run: |
          if [ -z "${PACKAGIST_USER:-}" ] || [ -z "${PACKAGIST_TOKEN:-}" ]; then
            echo "::warning::PACKAGIST_* secrets missing"
            exit 0
          fi
          for repo in \
            https://github.com/Maijied/Reportkit-Laravel \
            https://github.com/Maijied/Reportkit-Laravel-Legacy; do
            echo "== update-package ${repo}"
            curl -sS -X POST -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${PACKAGIST_USER}:${PACKAGIST_TOKEN}" \
              'https://packagist.org/api/update-package' \
              -d "{\"repository\":{\"url\":\"${repo}\"}}" \
              | jq -c '{status, message: (.message // .error // "ok")}'
          done
