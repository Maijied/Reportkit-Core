name: Laravel legacy release

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [beta, rc, stable]
        default: beta
      bump:
        type: choice
        options: [prerelease, patch, minor, major]
        default: prerelease
      dry_run:
        type: boolean
        default: false
  push:
    tags: ['laravel-legacy/v*']

permissions:
  contents: write

concurrency:
  group: release-reportkit-laravel-legacy
  cancel-in-progress: false

env:
  PACKAGE_DIR: reportkit-laravel-legacy
  TAG_PREFIX: laravel-legacy/
  PACKAGIST_REPO: https://github.com/Maijied/Reportkit-Website
  PACKAGE_NAME: reportkit/laravel-legacy

jobs:
  plan-and-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - name: Resolve next version
        id: meta
        run: |
          set -euo pipefail
          chmod +x bin/next-version.sh
          LATEST="$(git tag -l '${{ env.TAG_PREFIX }}v*' --sort=-v:refname | head -n1 || true)"
          TAG="$(./bin/next-version.sh "${{ inputs.channel }}" "${{ inputs.bump }}" "${LATEST:-}" "${{ env.TAG_PREFIX }}")"
          VERSION="${TAG#${{ env.TAG_PREFIX }}v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Dry run
        if: inputs.dry_run == true
        run: echo "::notice::Would create ${{ steps.meta.outputs.tag }}"
      - name: Create annotated tag
        if: inputs.dry_run == false
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Meta from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#${{ env.TAG_PREFIX }}v}"
          PRERELEASE=false
          CHANNEL=stable
          case "$VERSION" in
            *-beta.*) PRERELEASE=true; CHANNEL=beta ;;
            *-rc.*) PRERELEASE=true; CHANNEL=rc ;;
          esac
          { echo "tag=$TAG"; echo "version=$VERSION"; echo "channel=$CHANNEL"; echo "prerelease=$PRERELEASE"; } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ReportKit Laravel Legacy ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
      - name: Notify Packagist
        env:
          PACKAGIST_USER: ${{ secrets.PACKAGIST_USER }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "${PACKAGIST_USER:-}" ] || [ -z "${PACKAGIST_TOKEN:-}" ]; then exit 0; fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${PACKAGIST_USER}:${PACKAGIST_TOKEN}" \
            'https://packagist.org/api/update-package' \
            -d "{\"repository\":\"${{ env.PACKAGIST_REPO }}\"}"
      - name: Rebuild website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PAYLOAD=$(jq -nc --arg p "$PACKAGE_NAME" --arg v "${{ steps.meta.outputs.version }}" --arg c "${{ steps.meta.outputs.channel }}" --arg t "${{ steps.meta.outputs.tag }}" '{package:$p,version:$v,channel:$c,tag:$t}')
          gh api "repos/${{ github.repository }}/dispatches" --input - <<<"{\"event_type\":\"package-released\",\"client_payload\":$PAYLOAD}" || true
