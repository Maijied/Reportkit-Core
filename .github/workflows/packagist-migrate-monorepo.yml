name: Packagist migrate monorepo

on:
  workflow_dispatch:
    inputs:
      create_tags:
        description: Create laravel/* and laravel-legacy/* tags on monorepo if missing
        type: boolean
        default: true
      edit_urls:
        description: PUT Packagist edit API to point both Laravel packages at monorepo
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      PACKAGIST_USER: ${{ secrets.PACKAGIST_USER }}
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
      MONOREPO: https://github.com/Maijied/Reportkit-Core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create monorepo release tags (if missing)
        if: inputs.create_tags == true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for spec in "laravel/v0.1.1-beta.1:ReportKit Laravel beta" "laravel/v0.1.0:ReportKit Laravel 0.1.0" "laravel-legacy/v0.1.1-beta.1:ReportKit Laravel Legacy beta" "laravel-legacy/v0.1.0:ReportKit Laravel Legacy 0.1.0"; do
            tag="${spec%%:*}"
            msg="${spec#*:}"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "Tag exists: $tag"
            else
              git tag -a "$tag" -m "$msg"
              git push origin "$tag"
              echo "Created $tag"
            fi
          done

      - name: Edit Packagist repository URLs (PUT API)
        if: inputs.edit_urls == true
        run: |
          set -euo pipefail
          test -n "${PACKAGIST_USER:-}" && test -n "${PACKAGIST_TOKEN:-}" || {
            echo "::error::Missing PACKAGIST_USER or PACKAGIST_TOKEN"
            exit 1
          }
          for pkg in laravel laravel-legacy; do
            echo "== PUT reportkit/${pkg}"
            resp=$(curl -sS -w '\nHTTP:%{http_code}' -X PUT \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${PACKAGIST_USER}:${PACKAGIST_TOKEN}" \
              "https://packagist.org/api/packages/reportkit/${pkg}" \
              -d "{\"repository\":\"${MONOREPO}\"}")
            body="${resp%HTTP:*}"
            code="${resp##*HTTP:}"
            echo "$body" | jq -c . 2>/dev/null || echo "$body"
            echo "HTTP $code"
            echo "$body" | jq -e '.status == "success"' >/dev/null || {
              echo "::error::Failed to edit reportkit/${pkg}"
              exit 1
            }
          done

      - name: Verify repository URLs
        run: bash reportkit-website/scripts/packagist-verify-monorepo.sh --strict

      - name: Notify Packagist (update-package hook)
        run: |
          for i in 1 2 3; do
            curl -sS -X POST \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${PACKAGIST_USER}:${PACKAGIST_TOKEN}" \
              'https://packagist.org/api/update-package' \
              -d "{\"repository\":{\"url\":\"${MONOREPO}\"}}" \
              | jq -c '{status, message: (.message // .error // "ok")}' || true
            sleep 5
          done

      - name: Final verify
        run: bash reportkit-website/scripts/packagist-verify-monorepo.sh --strict
